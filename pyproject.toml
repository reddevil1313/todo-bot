[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "todo-bot"
version = "0.1.0"
description = "Telegram to-do bot built around the Eisenhower matrix"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue,webhooks]>=21,<23",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "tzdata",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools]
packages = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
